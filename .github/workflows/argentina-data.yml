name: Argentina data extension
on:
  push:
    branches: [improve/argentina-lnb]
    paths: [src/bbtahmin/veri/argentina.py, scripts/collect_argentina.py, .github/workflows/argentina-data.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: argentina-data-extension
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: python scripts/collect_argentina.py
      - run: python scripts/evaluate_regional.py --ligler ARG_LNB --cikti docs/kanit/argentina_models
      - run: python -m bbtahmin gunluk --ligler ARG_LNB --saat 168 --cikti data/argentina_ledger
      - name: Persist data and factual validation evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/competitions/ARG_LNB* docs/kanit/competitions/ARG_LNB* docs/kanit/argentina_models/ data/argentina_ledger/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Collect Argentina LNB history and record independent evaluation'
          git push origin HEAD:${{ github.ref_name }}
