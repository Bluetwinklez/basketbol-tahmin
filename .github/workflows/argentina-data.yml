name: Argentina data extension
on:
  push:
    branches: [improve/argentina-lnb]
    paths: [scripts/probe_argentina.py, .github/workflows/argentina-data.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: argentina-data-extension
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/probe_argentina.py
      - name: Persist source diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/kanit/argentina/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Argentina source diagnostics'
          git push origin HEAD:${{ github.ref_name }}
