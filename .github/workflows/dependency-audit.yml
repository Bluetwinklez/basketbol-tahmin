name: Dependency audit
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python requirements
        shell: bash
        run: |
          set +e
          output="$(pip-audit -r requirements.txt 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          {
            echo "## Python dependency audit (\`requirements.txt\`)"
            echo ""
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Audit Node production dependencies
        shell: bash
        run: |
          set +e
          output="$(npm audit --omit=dev --audit-level=high 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          {
            echo "## Node dependency audit (\`npm audit --omit=dev --audit-level=high\`)"
            echo ""
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
