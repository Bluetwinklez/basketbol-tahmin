name: Archive pregame observations
on:
  workflow_dispatch:
  schedule:
    - cron: '15 20,23 * * *'
permissions:
  contents: write
concurrency:
  group: archive-pregame-observations
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Collect actual published reports and scoreboard observations
        id: collect
        continue-on-error: true
        run: python scripts/collect_observations.py
      - name: Persist observations without changing models or forecasts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observations/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive timestamped pregame observations'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Surface total collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
