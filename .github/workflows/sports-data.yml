name: Refresh sports data and frozen forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
permissions:
  contents: write
concurrency:
  group: sports-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Refresh independent football and basketball sources
        id: collect
        continue-on-error: true
        run: python scripts/refresh_sports.py
      - name: Preserve data and earliest forecasts even on partial failure
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ docs/kanit/competitions/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh separate sports archives and frozen forecasts'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Surface incomplete source refresh
        if: steps.collect.outcome == 'failure'
        run: exit 1
