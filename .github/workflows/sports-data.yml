name: Refresh sports data and frozen forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
    - cron: '45 4 * * 0'
permissions:
  contents: write
concurrency:
  group: sports-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Restore source repositories for incremental updates
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime/openfootball/
            .runtime/futbol-argentino-data/
          key: sports-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sports-sources-v1-${{ runner.os }}-
      - name: Refresh independent football and basketball sources
        id: collect
        continue-on-error: true
        run: python scripts/refresh_sports.py ${{ github.event.schedule == '45 4 * * 0' && '--backfill' || '' }}
      - name: Save source repositories even after partial collection
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime/openfootball/
            .runtime/futbol-argentino-data/
          key: sports-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Independently confirm football fixtures
        id: fixtures
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/confirm_football_fixtures.py --lookback ${{ github.event.schedule == '45 4 * * 0' && '40' || '2' }}
      - name: Inspect separately licensed football sources
        id: licensed_sources
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/inspect_wikipedia_football.py
      - name: Collect separately licensed football supplement
        id: licensed
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/collect_licensed_football.py
      - name: Freeze and settle paired forward candidates
        id: shadow
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/run_shadow_cycle.py
      - name: Freeze football forecasts after independent checks and supplements
        id: football
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: python -m bbtahmin futbol daily --output data/football_ledger
      - name: Verify original forecasts
        id: originals
        if: always() && steps.collect.outcome != 'skipped'
        run: python scripts/pin_improvement_baseline.py --verify-only
      - name: Preserve data and earliest forecasts even on partial failure
        if: always() && steps.collect.outcome != 'skipped' && steps.originals.outcome == 'success' && steps.shadow.outcome == 'success' && steps.football.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ docs/kanit/competitions/ docs/kanit/asia_data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh separate sports archives and frozen forecasts'
          git diff --exit-code
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-refresh-evidence
          path: |
            data/refresh/
            data/improvement_shadow/latest.json
            data/football_fixture_checks/latest.json
            data/football/licensed_collection.json
            data/football/licensed_source_refresh.json
            data/improvement_shadow/experiments/
            docs/kanit/asia_data/
            docs/kanit/competitions/*_collection.json
      - name: Surface incomplete source refresh
        if: steps.collect.outcome == 'failure' || steps.fixtures.outcome == 'failure' || steps.licensed_sources.outcome == 'failure' || steps.licensed.outcome == 'failure' || steps.shadow.outcome == 'failure' || steps.football.outcome == 'failure'
        run: exit 1

